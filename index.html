<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102421" />
    <title>Amino Dash</title>
    <link rel="stylesheet" href="style.css?v=3" />
    <script defer src="data.js?v=3"></script>
    <script defer src="editor.js?v=3"></script>
    <script defer src="app.js?v=3"></script>
  </head>
  <body>
    <header>
      <a href="#" id="brand">A<span>↗</span> AMINO DASH</a>
      <nav>
        <button id="home">Play</button><button id="atlas">Field guide</button
        ><button id="backup">Save / restore</button><button id="readme">Readme</button><label class="theme-label">Theme<select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="grey">Light grey</option><option value="light">Light</option><option value="slate">Slate</option></select></label>
      </nav>
    </header>
    <div id="storage-warning" role="status"></div>
    <main id="app"></main>
    <footer>
      Progress saves in this browser · No account required
    </footer>
    <div id="effects" aria-hidden="true"></div>
    <dialog id="modal">
      <button id="close-modal" class="close" aria-label="Close dialog">
        ×
      </button>
      <div id="modal-body"></div>
    </dialog>
  </body>
</html>
